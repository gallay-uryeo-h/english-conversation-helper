name: Deploy to Firebase Hosting (School)
on:
  workflow_dispatch:

jobs:
  build_and_deploy_school:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build (School Mode)
        run: npm install --legacy-peer-deps && npm run build:school

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: studio-2726051254-c02c9
          firebaseToolsVersion: '15.34.0'

